name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Validate the checked-in AutoDL configuration
        run: >-
          python -c "from lse_v2.config import load_config;
          load_config('configs/autodl_4090.json');
          print('CONFIG_OK')"
      - run: python -m pytest
      - run: python -m pip wheel --no-deps --wheel-dir dist .
